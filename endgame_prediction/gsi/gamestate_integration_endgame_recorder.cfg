"Independent endgame GSI recorder"
{
    "uri"       "http://127.0.0.1:3002/gsi"
    "timeout"   "5.0"
    "buffer"    "0.1"
    "throttle"  "0.1"
    "heartbeat" "1.0"
    "output"
    {
        "precision_time"     "3"
        "precision_position" "3"
    }
    // Optional: match ENDGAME_GSI_TOKEN in the recorder's terminal.
    // "auth" { "token" "your-local-token" }
    "data"
    {
        "provider"              "1"
        "map"                   "1"
        "map_round_wins"        "1"
        "round"                 "1"
        "allplayers_id"         "1"
        "allplayers_state"      "1"
        "allplayers_match_stats" "1"
        "allplayers_weapons"    "1"
        "allplayers_position"   "1"
        "phase_countdowns"      "1"
        "bomb"                  "1"
    }
}
